services:
  postgres:
    image: postgres:16-alpine
    container_name: qr-studio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrstudio
      POSTGRES_PASSWORD: qrstudio_dev_password
      POSTGRES_DB: qrstudio
    ports:
      - "5432:5432"
    volumes:
      - qr_studio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrstudio -d qrstudio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qr_studio_pgdata:
